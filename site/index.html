<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Darwan: themes for your login screen and lockscreen</title>
    <meta name="description" content="Choose, customise, preview and apply 40 hand-crafted themes to your SDDM login screen and your Quickshell lockscreen, from one app on Arch Linux." />
    <meta name="theme-color" content="#13141f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Before first paint, so a light-theme visitor never sees a dark flash; src/theme.ts takes over after.
      try {
        var c = localStorage.getItem("darwan-theme");
        var light = c === "light" || (c !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="icon" href="/darwan.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
